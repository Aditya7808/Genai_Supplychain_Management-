[project]
name = "genai-inventory-assistant"
version = "1.0.0"
description = "GenAI-powered Inventory & Demand-Forecasting Assistant"
requires-python = ">=3.11"
authors = [
    {name = "Aditya Yadav"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "prophet>=1.1.5",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "faiss-cpu>=1.8.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pyright]
extraPaths = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
